server:
  port: 9090
  tomcat:
    async-request-timeout: 300000  # 设置异步请求超时时间为 5 分钟（300 秒）
    threads:
      max: 200
      min-spare: 10
    connection-timeout: 600000
    keep-alive-timeout: 600000
    max-keep-alive-requests: 100
spring:
  mvc:
    async:
      request-timeout: 5m
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  ai:
    openai: #openai配置
      base-url: https://dashscope.aliyuncs.com/compatible-mode #api地址
      api-key: ${aliyun.openai.api-key}
      chat:
        options:
          model: qwen-plus  #模型名称
      embedding:
        options:
          model: text-embedding-v4
          dimensions: 1024
    dashscope:
      chat:
        options:
          model: qwen-plus
          temperature: 0.7
      api-key: ${aliyun.openai.api-key}
      agent:
        api-key: ${aliyun.openai.api-key}
      connection-timeout: 30s
      read-timeout: 120000

  application:
    name: AutoMind
  profiles:
    active: dev
  datasource:
    url: jdbc:mysql://${hm.db.host}/network?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${hm.db.pw}
    hikari:
      maximum-pool-size: 20          # 最大连接数
      minimum-idle: 5                # 最小空闲连接数
      idle-timeout: 600000           # 空闲超时时间 (10 分钟)
      connection-timeout: 30000      # 连接超时时间 (30 秒)
      max-lifetime: 1800000          # 连接最大生命周期 (30 分钟)
      pool-name: PilotHikariCP       # 连接池名称

  servlet:
    multipart:
      max-file-size: 100MB  # 单个文件最大
      max-request-size: 100MB  # 整个请求最大
      file-size-threshold: 10MB  # 超过这个值写入临时文件，不占内存
  data:
    redis:
      host: ${my.db.host}
      port: 6379
      password: ${hm.db.pw}
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: 100ms
mybatis-plus:
  configuration:
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    db-config:
      update-strategy: not_null
      id-type: auto
logging:
  level:
    com.hmall: debug
  pattern:
    dateformat: HH:mm:ss:SSS
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level [%X{traceId}] %logger{36} - %msg%n"
  file:
    path: "logs/${spring.application.name}"
hm:
  auth:
    excludePaths:
      - /search/**
      - /users/login
      - /items/**
      - /hi
jwt:
  token-ttl: 1m
# keytool -genkeypair -alias hmall -keyalg RSA -keypass hmall123 -keystore hmall.jks -storepass hmall123
aliyun:
  oss:
    endpoint: ${aliyun.oss.en}
    bucketName: ${aliyun.oss.bu}
    region: ${aliyun.oss.re}


springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan:
        - com.hs.controller
        - com.hs.mcp.server
        - com.hs.a2a
resilience4j:
  retry:
    instances:
      aiServiceRetry:
        maxAttempts: 3
        waitDuration: 2s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
      mcpRetry:
        maxAttempts: 3
        waitDuration: 200ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
      healingRetry:
        maxAttempts: 3
        waitDuration: 1000ms
        retryExceptions:
          - com.hs.healing.exception.HealingRetryableException
  circuitbreaker:
    instances:
      aiServiceCb:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
      mcpCb:
        slidingWindowSize: 20
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
automind:
  auth:
    jwt:
      secret: ${AUTOMIND_JWT_SECRET:automind-local-dev-secret-change-me}
      ttl-seconds: 86400
  sla:
    default-window: 5m
    dashboard-window: 5m
    default-targets:
      latency-ms: 50
      jitter-ms: 10
      loss-rate: 0.01
      bandwidth-usage: 80.00
  realtime:
    internal-token: ${AUTOMIND_INTERNAL_TOKEN:automind-internal-dev-token}
    sse-timeout-ms: 300000
  trace:
    header-name: X-Trace-Id
  agent:
    confidence-threshold: 0.7
    timeout-ms: 30000
    max-retries: 3
    supervisor:
      system-prompt-path: classpath:/prompts/supervisor.st
    planner:
      system-prompt-path: classpath:/prompts/planner.st
    executor:
      system-prompt-path: classpath:/prompts/executor.st
    monitor:
      system-prompt-path: classpath:/prompts/monitor.st
  mcp:
    server-base-url: http://localhost:9090
    timeout-ms: 5000
    max-retries: 3
    retry-backoff-ms: 200
    high-risk-tools: [set_qos, block_flow]
    tools:
      - name: get_topo
        version: v1
        high-risk: false
        description: 查询当前域拓扑（节点 + 链路）
        required-roles: [ADMIN, OPS, OPERATOR, AUDITOR]
      - name: set_qos
        version: v1
        high-risk: true
        description: 设置链路 QoS 策略（带宽 + 优先级）
        required-roles: [ADMIN, OPS, OPERATOR]
      - name: block_flow
        version: v1
        high-risk: true
        description: 阻断指定流量五元组
        required-roles: [ADMIN, OPS, OPERATOR]
    fault-injection:
      set_qos:
        TIMEOUT: 0
        RES_CONFLICT: 0
        PERMISSION: 0
  a2a:
    timeout-ms: 500
    shared-secret: ${AUTOMIND_A2A_SECRET:dev-secret}
    inbox-path: /a2a/inbox
  approval:
    expire-minutes: 60
    auto-approve-roles: []
    expire-scan-cron: "0 * * * * *"
  healing:
    max-attempts: 3
    retry-backoff-ms: 1000
    handoff-webhook-url: ""
    handoff-on-events:
      - SlaBreachEvent
      - McpTimeoutEvent
      - A2aDegradedEvent

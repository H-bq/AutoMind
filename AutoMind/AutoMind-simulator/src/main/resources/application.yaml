server:
  port: 9091
spring:
  profiles:
    active: dev
  application:
    name: AutoMind-simulator
  datasource:
    url: jdbc:mysql://${hm.db.host}/network?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${hm.db.pw}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      max-lifetime: 1800000
      pool-name: AutoMindSimulatorHikariCP
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      update-strategy: not_null
logging:
  level:
    com.hs.simulator: info
  pattern:
    dateformat: HH:mm:ss:SSS
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
automind:
  simulator:
    enabled: true
    admin-token: ${AUTOMIND_SIMULATOR_ADMIN_TOKEN:automind-simulator-admin-dev-token}
    service-base-url: ${AUTOMIND_SERVICE_BASE_URL:http://localhost:9090}
    internal-token: ${AUTOMIND_INTERNAL_TOKEN:automind-internal-dev-token}
    notify-service-enabled: true
    generate-interval-ms: 5000
    evaluate-interval-ms: 8000
    cleanup-interval-ms: 30000
    retention-minutes: 1
    cleanup-batch-size: 200
    cleanup-max-batches-per-run: 10
    evaluation-window: 5m
    anomaly-burst-samples: 30
    metrics:
      - LATENCY
      - JITTER
      - LOSS
      - BANDWIDTH
    default-targets:
      latency-ms: 50
      jitter-ms: 10
      loss-rate: 0.01
      bandwidth-usage: 80.00
